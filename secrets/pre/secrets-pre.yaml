# Declared secrets for the 'pre' environment — NAMES ONLY.
# Every name must also exist in every other env file (CI enforces parity).
# Values are NEVER committed here: they live in the platform credential
# store (Supabase Vault) under `<NAME>__<ENV>` and are loaded through the
# dashboard's Seguridad view. Deploy fails if a declared name has no value.

secrets:
  - name: EXAMPLE_API_KEY
  - name: EXAMPLE_DB_PASSWORD
